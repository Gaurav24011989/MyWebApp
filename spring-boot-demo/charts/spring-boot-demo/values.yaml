replicaCount: 1

image:
  repository: springbootdemogb2026.azurecr.io/spring-boot-demo
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: acr-secret

service:
  type: LoadBalancer
  port: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50

probes:
  liveness:
    path: /actuator/health/liveness
  readiness:
    path: /actuator/health/readiness
